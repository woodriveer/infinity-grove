services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: infinity_grove
      POSTGRES_USER: infinity_grove
      POSTGRES_PASSWORD: infinity_grove_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinity_grove -d infinity_grove"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/InfinityGrove.Backend.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=infinity_grove;Username=infinity_grove;Password=infinity_grove_dev"
      Steamworks__PublisherKey: "${STEAM_PUBLISHER_KEY:-}"
      Steamworks__AppId: "${STEAM_APP_ID:-480}"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-local-dev-only-signing-key-do-not-use-in-production-00000}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
