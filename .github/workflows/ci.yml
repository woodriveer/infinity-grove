# AD-21: the same gates the agent runs locally, on every push.
name: ci

on:
  push:
  pull_request:

jobs:
  client-verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: Client/.nvmrc
          cache: npm
          cache-dependency-path: Client/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      # AD-13 shell smoke: sandboxed renderer, exact bridge allowlist (no Steam in CI).
      - name: Desktop shell smoke
        shell: bash
        run: if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npm run test:shell; else npm run test:shell; fi

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # RFR-18 AC: the backend must build with the Unity tree absent.
      - run: rm -rf InfinityGrove
      - run: dotnet build Backend/InfinityGrove.Backend.sln -c Release
      - run: dotnet test Backend/InfinityGrove.Backend.sln -c Release --no-build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version-file: Client/.nvmrc
          cache: npm
          cache-dependency-path: Client/package-lock.json
      - name: Export OpenAPI from the backend
        shell: pwsh
        run: ./Backend/tools/export-openapi.ps1
      - name: Regenerate test vectors (backend families; unity-frozen ones are frozen once Unity is archived)
        shell: pwsh
        run: ./Backend/tools/generate-vectors.ps1
      - name: Regenerate the API client
        working-directory: Client
        run: npm ci && npm run gen:api
      - name: Fail on contract drift
        run: git diff --exit-code -- shared/openapi shared/test-vectors Client/src/generated

  # RFR-29 / G2: client services against the real backend + PostgreSQL, with the
  # fake-Steam stub behind Steamworks__WebApiBaseUrl (backend unchanged, RNFR-6).
  sync-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: Client/.nvmrc
          cache: npm
          cache-dependency-path: Client/package-lock.json
      - name: Start PostgreSQL, the API and fake Steam
        working-directory: Backend
        run: docker compose -f docker-compose.yml -f tools/fake-steam/docker-compose.sync-e2e.yml up -d --build --wait postgres fake-steam && docker compose -f docker-compose.yml -f tools/fake-steam/docker-compose.sync-e2e.yml up -d --build api
      - name: Run the sync end-to-end suite
        working-directory: Client
        env:
          IG_SYNC_E2E_BACKEND: http://localhost:8080
        run: npm ci && npm run test:sync-e2e
      - name: Backend logs on failure
        if: failure()
        working-directory: Backend
        run: docker compose -f docker-compose.yml -f tools/fake-steam/docker-compose.sync-e2e.yml logs api fake-steam
